name: Build and Publish Firmware

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'include/**'
      - 'platformio.ini'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO
        uses: actions/cache@v3
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Create secrets.h
        run: |
          echo "#pragma once" > include/secrets.h
          echo "const char* WIFI_SSID = \"${{ secrets.WIFI_SSID }}\";" >> include/secrets.h
          echo "const char* WIFI_PASS = \"${{ secrets.WIFI_PASS }}\";" >> include/secrets.h
        # Fallback to hardcoded if secrets are missing (for initial test)
        if: env.WIFI_SSID == ''
        env:
          WIFI_SSID: ${{ secrets.WIFI_SSID }}

      - name: Build Firmware
        run: pio run

      - name: Prepare OTA Files
        run: |
          mkdir -p docs
          cp .pio/build/esp32-c3-devkitm-1/firmware.bin docs/firmware.bin
          
          # Generate version.json
          COMMIT_HASH=$(git rev-parse --short HEAD)
          echo "{" > docs/version.json
          echo "  \"firmwares\": [" >> docs/version.json
          echo "    {" >> docs/version.json
          echo "      \"name\": \"dashboard\"," >> docs/version.json
          echo "      \"version\": \"$COMMIT_HASH\"," >> docs/version.json
          echo "      \"url\": \"https://enderekici.github.io/esp32c3/firmware.bin\"" >> docs/version.json
          echo "    }" >> docs/version.json
          echo "  ]" >> docs/version.json
          echo "}" >> docs/version.json

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add docs/firmware.bin docs/version.json
          git commit -m "Update firmware [skip ci]" || echo "No changes to commit"
          git push
